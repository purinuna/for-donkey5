<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--OG-->
<title>archive of days</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="archive of days">
<meta property="og:description" content="">
<meta property="og:image" content="https://purinuna.github.io/for-donkey5/cover.jpg">
<meta property="og:url" content="https://purinuna.github.io/for-donkey5/">
<!--/OG-->
<meta name="theme-color" content="#faf8f3">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Gowun+Batang&display=swap">
<style>
/* Layout: a mobile-invitation column (max 480px, centered on wide screens): full-screen photo, the quote, ARCHIVE (tags, featured grid, all-photos button), footer with update date and share. The full archive and the photo view open as layers over it. */
:root{
  --page:#faf8f3; --outside:#efeae1; --soft:#f2eee6; --ink:#2f2a25; --ink2:#8b8278; --line:#e3dccf; --dark:#1f1c19;
  --kr:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --en:"Cormorant Garamond","Gowun Batang",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--outside)}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:480px;margin:0 auto;background:var(--page);min-height:100vh;box-shadow:0 0 40px rgba(60,45,30,.06)}
.eng{font-family:var(--en);text-transform:uppercase;letter-spacing:.32em;color:var(--ink2);font-size:12px;font-weight:500}

/* reveal on scroll: visible by default, only hidden once the script is running */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}

/* cover */
.cover{position:relative;height:100vh;height:100svh;min-height:520px;max-height:960px;background:#2a2622;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block}
.cue{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:1px;height:46px;background:rgba(255,255,255,.25);overflow:hidden}
.cue::after{content:"";position:absolute;left:0;top:-46px;width:1px;height:46px;background:#fff;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{to{top:46px}}
@media (prefers-reduced-motion:reduce){.cue::after{animation:none;top:0}}

/* quote */
.quote{padding-top:128px;padding-bottom:128px;text-align:center}
.quote p{margin:0 auto;max-width:21em;font-size:16px;line-height:2.15;word-break:keep-all;white-space:pre-line}
.quote cite{display:block;margin-top:26px;font-style:normal;font-size:12.5px;color:var(--ink2);letter-spacing:.02em}
.rule{width:1px;height:56px;background:var(--line);margin:0 auto}

/* archive */
.archive{padding-top:96px;padding-bottom:40px;text-align:center}
.archive h2{margin:0;font-family:var(--en);font-weight:400;font-size:30px;letter-spacing:.36em;text-indent:.36em;color:var(--ink)}
.archive .meta{margin-top:10px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:30px}
.tag{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2);background:var(--page);line-height:1.5}
.tag:hover{border-color:var(--ink2);color:var(--ink)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:28px}
.feat button{display:block;aspect-ratio:1;overflow:hidden;background:var(--soft)}
.feat img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
@media (hover:hover){.feat button:hover img{transform:scale(1.04)}}
.all{display:inline-flex;align-items:baseline;gap:10px;margin-top:34px;border:1px solid var(--ink);border-radius:999px;padding:13px 30px;font-size:14px;letter-spacing:.06em}
.all span{font-family:var(--en);font-size:15px;color:var(--ink2);letter-spacing:.04em}
.empty{color:var(--ink2);font-size:14px;margin-top:28px}

/* footer */
footer{padding-top:64px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;display:grid;gap:18px;justify-items:center}
footer .upd{font-family:var(--en);font-size:13px;letter-spacing:.24em;color:var(--ink2);text-transform:uppercase}
.share{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:3px;letter-spacing:.04em}
.share svg{width:15px;height:15px}

/* layers */
.layer{position:fixed;inset:0;background:var(--page);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#album{z-index:20}
#viewer{z-index:30}
.lbar{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:6px;height:54px}
.lbar .ttl{flex:1;text-align:center;font-family:var(--en);letter-spacing:.3em;text-indent:.3em;font-size:15px}
.ico{width:44px;height:44px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--ink)}
.filters{max-width:1040px;margin:0 auto;display:grid;gap:8px;padding-bottom:12px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.row .lab{flex:none;width:40px;font-family:var(--en);font-size:11px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;color:var(--ink2);background:var(--page)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.chip .n{font-family:var(--en);margin-left:5px;opacity:.75}
.awrap{max-width:1040px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.count{margin:22px 0 14px;font-family:var(--en);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.grid{display:flex;gap:8px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.grid{gap:14px}.col{gap:22px}}
.print{display:grid;gap:6px;text-align:left;min-width:0}
.print .ph{position:relative;background:var(--soft);aspect-ratio:var(--ar,4/3);overflow:hidden}
.print img{width:100%;height:100%;object-fit:cover;display:block}
.print .cap{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print .cap:empty{display:none}
.none{padding:60px 0;text-align:center;color:var(--ink2)}

/* photo view */
.post{max-width:640px;margin:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.pimg{background:var(--soft);touch-action:pan-y}
.pimg img{width:100%;max-height:76vh;object-fit:contain;display:block}
.pcap{padding-top:22px;display:grid;gap:10px;text-align:center}
.pcap .when{font-family:var(--en);font-size:17px;letter-spacing:.12em}
.pcap .when span{font-family:var(--kr);font-size:13px;color:var(--ink2);letter-spacing:0}
.pcap .txt{font-size:15.5px;line-height:1.95;white-space:pre-line;word-break:keep-all}
.ptags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.ptags .tag.person::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink2);margin-right:6px;vertical-align:2px}
.vact{display:flex;justify-content:center;padding-top:26px}
.save{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:11px 24px;font-size:14px;letter-spacing:.04em}
.save svg{width:16px;height:16px}
.save[disabled]{opacity:.5}
.hint{text-align:center;font-size:12px;color:var(--ink2);margin:16px 0 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--dark);color:var(--page);padding:10px 18px;border-radius:999px;font-size:13.5px;max-width:calc(100% - 40px);text-align:center;word-break:break-all}
</style>
</head>
<body>
<script>document.documentElement.classList.add("js")</script>
<div class="page">
  <header class="cover">
    <img id="cover-img" src="cover.jpg" alt="">
    <div class="cue" aria-hidden="true"></div>
  </header>

  <section class="quote gut" id="quote" hidden>
    <p class="rv" id="q-text"></p>
    <cite class="rv" id="q-src"></cite>
  </section>

  <div class="rule"></div>

  <section class="archive gut" id="archive">
    <h2 class="rv">ARCHIVE</h2>
    <div class="eng meta rv" id="a-meta"></div>
    <div class="tags rv" id="a-tags"></div>
    <div class="feat rv" id="a-feat"></div>
    <p class="empty" id="a-empty" hidden>사진을 준비하고 있어요</p>
    <button class="all rv" id="a-all" type="button">전체 사진 보기<span id="a-count"></span></button>
  </section>

  <footer class="gut">
    <div class="rule" style="height:40px"></div>
    <div class="upd" id="f-upd"></div>
    <button class="share" id="f-share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v6.5h14V13"/></svg>링크 공유하기</button>
  </footer>
</div>

<div class="layer" id="album" hidden role="dialog" aria-modal="true" aria-label="전체 사진">
  <div class="lbar gut">
    <div class="in"><button class="ico" id="al-close" aria-label="돌아가기">‹</button><span class="ttl">ARCHIVE</span><span style="width:44px"></span></div>
    <div class="filters">
      <div class="row" id="r-people"></div>
      <div class="row" id="r-tags"></div>
    </div>
  </div>
  <div class="awrap gut" id="pages"></div>
</div>

<div class="layer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="lbar gut">
    <div class="in"><button class="ico" id="v-close" aria-label="닫기">✕</button><button class="ico" id="v-prev" aria-label="이전 사진">‹</button><span class="ttl" id="v-pos" style="letter-spacing:.14em;text-indent:0;font-size:14px;color:var(--ink2)"></span><button class="ico" id="v-next" aria-label="다음 사진">›</button><span style="width:44px"></span></div>
  </div>
  <div class="post">
    <div class="pimg" id="v-print"><img id="v-img" alt=""></div>
    <div class="gut">
      <div class="pcap" id="v-cap"></div>
      <div class="vact"><button class="save" id="v-save" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>사진 저장</button></div>
      <p class="hint">옆으로 밀면 다음 사진으로 넘어가요</p>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script>
(function(){
const A=window.ALBUM||{meta:{},people:[],photos:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const meta=Object.assign({title:"기억하는 방법",quote:"",quoteSrc:"",updated:0},A.meta||{});
const people=A.people||[];
const photos=(A.photos||[]).slice().sort((a,b)=>(a.year||9999)-(b.year||9999)||(a.added||0)-(b.added||0));
const pmap=Object.fromEntries(people.map(p=>[p.id,p.name]));
const ratio=p=>p.w&&p.h?Math.min(2.6,Math.max(.45,p.w/p.h)):4/3;
const thumb=p=>"photos/thumb/"+p.id+".jpg", full=p=>"photos/full/"+p.id+".jpg";
function toast(t,ms=2600){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}
const isPhone=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);

/* ---------- main page ---------- */
const coverP=meta.cover&&photos.find(p=>p.id===meta.cover);
if(coverP)$("cover-img").src=full(coverP);
$("cover-img").alt="아빠의 사진";
if(meta.quote){$("quote").hidden=false;$("q-text").textContent=meta.quote;$("q-src").textContent=meta.quoteSrc||"";$("q-src").hidden=!meta.quoteSrc}

$("a-meta").textContent=photos.length?`${photos.length.toLocaleString()} photos`:"";
const tc=new Map();photos.forEach(p=>(p.tags||[]).forEach(t=>tc.set(t,(tc.get(t)||0)+1)));
const tagList=[...tc.keys()].sort((a,b)=>tc.get(b)-tc.get(a)||a.localeCompare(b,"ko"));
$("a-tags").innerHTML=tagList.slice(0,14).map(t=>`<button class="tag" data-t="${esc(t)}">#${esc(t)}</button>`).join("");
$("a-tags").hidden=!tagList.length;
let featured=photos.filter(p=>p.f);
if(!featured.length)featured=photos.slice(0,12);
featured=featured.slice(0,30);
$("a-feat").innerHTML=featured.map((p,i)=>`<button data-i="${i}" aria-label="${esc(p.caption||p.place||"사진")}"><img loading="lazy" decoding="async" src="${thumb(p)}" alt=""></button>`).join("");
$("a-feat").hidden=!featured.length;$("a-empty").hidden=!!photos.length;
$("a-all").hidden=!photos.length;$("a-count").textContent=photos.length.toLocaleString();
if(meta.updated){const d=new Date(meta.updated);$("f-upd").textContent=`Updated  ${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}`}

$("a-feat").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)openViewer(featured,+b.dataset.i)});
$("a-tags").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;Object.assign(S,{fTag:b.dataset.t,fPerson:null});openAlbum()});
$("a-all").onclick=()=>{Object.assign(S,{fTag:null,fPerson:null});openAlbum()};

$("f-share").onclick=async()=>{
  const url=location.href.split("#")[0];
  if(isPhone&&navigator.share){try{await navigator.share({title:document.title,url})}catch(e){}return}
  try{await navigator.clipboard.writeText(url);toast("링크를 복사했어요")}
  catch(e){toast(url,6000)}
};

/* reveal on scroll */
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}else document.querySelectorAll(".rv").forEach(el=>el.classList.add("in"));

/* ---------- layers + back button ---------- */
const stack=[];let ignorePop=0;
function lock(){document.documentElement.style.overflow=document.body.style.overflow=stack.length?"hidden":""}
function openLayer(id){if(stack[stack.length-1]===id)return;stack.push(id);$(id).hidden=false;lock();try{history.pushState({layer:id},"")}catch(e){}}
function hideTop(){const id=stack.pop();if(id)$(id).hidden=true;lock()}
function closeLayer(){if(!stack.length)return;hideTop();if(history.state&&history.state.layer){ignorePop++;history.back()}}
addEventListener("popstate",()=>{if(ignorePop){ignorePop--;return}hideTop()});

/* ---------- full archive ---------- */
const S={fPerson:null,fTag:null,view:[]};
const colCount=()=>{const w=Math.min(innerWidth,1040);return w<600?2:w<900?3:4};
function filtered(){return photos.filter(p=>(!S.fPerson||(p.people||[]).includes(S.fPerson))&&(!S.fTag||(p.tags||[]).includes(S.fTag)))}
let lastCols=0;
function renderAlbum(){
  const pc=new Map();photos.forEach(p=>(p.people||[]).forEach(id=>pc.set(id,(pc.get(id)||0)+1)));
  const ppl=people.filter(p=>pc.get(p.id)).sort((a,b)=>pc.get(b.id)-pc.get(a.id));
  $("r-people").hidden=!ppl.length;
  $("r-people").innerHTML=`<span class="lab">With</span><button class="chip" data-p="" aria-pressed="${!S.fPerson}">모두</button>`+
    ppl.map(p=>`<button class="chip" data-p="${esc(p.id)}" aria-pressed="${S.fPerson===p.id}">${esc(p.name)}<span class="n">${pc.get(p.id)}</span></button>`).join("");
  $("r-tags").hidden=!tagList.length;
  $("r-tags").innerHTML=`<span class="lab">Tag</span><button class="chip" data-t="" aria-pressed="${!S.fTag}">모두</button>`+
    tagList.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${S.fTag===t}">#${esc(t)}<span class="n">${tc.get(t)}</span></button>`).join("");
  const list=filtered();S.view=list;
  const pg=$("pages");
  if(!list.length){pg.innerHTML=`<div class="none">조건에 맞는 사진이 없어요</div>`;return}
  const nc=colCount();lastCols=nc;
  const cols=Array.from({length:nc},()=>({h:0,html:""}));
  list.forEach(p=>{
    const c=cols.reduce((a,b)=>b.h<a.h-1e-6?b:a);const cap=p.caption||p.place||"";
    c.h+=1/ratio(p)+(cap?.12:0)+.06;
    c.html+=`<button class="print" data-id="${esc(p.id)}" aria-label="${esc(p.caption||p.place||"사진")}"><div class="ph" style="--ar:${ratio(p)}"><img loading="lazy" decoding="async" src="${thumb(p)}" alt=""></div><div class="cap">${esc(cap)}</div></button>`;
  });
  const html=`<p class="count">${list.length.toLocaleString()} photos</p><div class="grid">`+cols.map(c=>`<div class="col">${c.html}</div>`).join("")+"</div>";
  pg.innerHTML=html;
}
function openAlbum(){renderAlbum();openLayer("album");$("album").scrollTop=0}
$("al-close").onclick=closeLayer;
addEventListener("resize",()=>{if(!$("album").hidden&&colCount()!==lastCols)renderAlbum()});
$("r-people").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;S.fPerson=b.dataset.p||null;renderAlbum();$("album").scrollTop=0});
$("r-tags").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;S.fTag=b.dataset.t||null;renderAlbum();$("album").scrollTop=0});
$("pages").addEventListener("click",e=>{const b=e.target.closest(".print");if(!b)return;openViewer(S.view,S.view.findIndex(p=>p.id===b.dataset.id))});

/* ---------- photo view ---------- */
const V={list:[],idx:-1};
function openViewer(list,i){if(i<0||!list.length)return;V.list=list;V.idx=i;show();openLayer("viewer")}
function show(){
  const p=V.list[V.idx];if(!p)return;
  $("v-pos").textContent=`${V.idx+1} / ${V.list.length}`;
  $("v-img").src=full(p);$("v-img").alt=p.caption||"";
  const names=(p.people||[]).filter(id=>pmap[id]);const tags=p.tags||[];
  $("v-cap").innerHTML=(p.place?`<div class="when"><span>${esc(p.place)}</span></div>`:"")+
    (p.caption?`<div class="txt">${esc(p.caption)}</div>`:"")+
    (names.length||tags.length?`<div class="ptags">${names.map(id=>`<button class="tag person" data-goto="${esc(id)}">${esc(pmap[id])}</button>`).join("")}${tags.map(t=>`<button class="tag" data-gotag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:"");
  $("viewer").scrollTop=0;prefetch(p);
  const nx=V.list[V.idx+1];if(nx){const im=new Image();im.src=full(nx)}
}
function step(d){V.idx=(V.idx+d+V.list.length)%V.list.length;show()}
$("v-close").onclick=closeLayer;$("v-prev").onclick=()=>step(-1);$("v-next").onclick=()=>step(1);
$("v-cap").addEventListener("click",e=>{const b=e.target.closest("[data-goto],[data-gotag]");if(!b)return;
  Object.assign(S,{fPerson:b.dataset.goto||null,fTag:b.dataset.gotag||null});
  if($("album").hidden){
    // swap the photo view for the archive in place, so the back button still returns to the main page
    $("viewer").hidden=true;stack[stack.length-1]="album";renderAlbum();$("album").hidden=false;$("album").scrollTop=0;
    try{history.replaceState({layer:"album"},"")}catch(e){}
  }else{closeLayer();renderAlbum();$("album").scrollTop=0}
});
addEventListener("keydown",e=>{if($("viewer").hidden)return;if(e.key==="Escape")closeLayer();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let x0=null,y0=0;
$("v-print").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
$("v-print").addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)});

/* save one photo: share sheet on phones (straight to the gallery), plain download elsewhere */
let pf={id:null,blob:null,promise:null};
function prefetch(p){
  if(pf.id===p.id)return;
  const mine={id:p.id,blob:null,promise:null};pf=mine;
  mine.promise=fetch(full(p)).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>{mine.blob=b;return b}).catch(()=>null);
}
function fileName(p){const base=p.caption||p.place||"사진_"+(V.idx+1);return base.replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,50)+".jpg"}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
$("v-save").onclick=async()=>{
  const p=V.list[V.idx];if(!p)return;const btn=$("v-save");
  let blob=pf.id===p.id?pf.blob:null;
  if(!blob){btn.disabled=true;prefetch(p);blob=await pf.promise;btn.disabled=false}
  if(!blob){toast("사진을 불러오지 못했어요. 사진을 길게 눌러 저장해 주세요",4000);return}
  const name=fileName(p);const file=new File([blob],name,{type:blob.type||"image/jpeg"});
  if(isPhone&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}
    catch(e){if(e&&e.name==="AbortError")return;toast("저장 창을 열지 못했어요. 사진을 길게 눌러 저장해 주세요",4500);return}
  }
  download(blob,name);toast(isPhone?"사진을 내려받았어요. ‘다운로드’에서 찾을 수 있어요":"사진을 내려받았어요");
};
})();
</script>
