<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--OG-->
<title>archive of days</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="archive of days">
<meta property="og:description" content="">
<meta property="og:image" content="https://purinuna.github.io/for-donkey5/cover.jpg">
<meta property="og:url" content="https://purinuna.github.io/for-donkey5/">
<!--/OG-->
<meta name="theme-color" content="#faf8f3">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Gowun+Batang&display=swap">
<style>
/* Layout: a mobile-invitation column (max 480px, centered on wide screens): full-screen photo, the quote, ARCHIVE (tags, featured grid, all-photos button), footer with update date and share. The full archive and the photo view open as layers over it. */
:root{
  --page:#faf8f3; --outside:#efeae1; --soft:#f2eee6; --ink:#2f2a25; --ink2:#8b8278; --line:#e3dccf; --dark:#1f1c19;
  --kr:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --en:"Cormorant Garamond","Gowun Batang",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--outside)}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:480px;margin:0 auto;background:var(--page);min-height:100vh;box-shadow:0 0 40px rgba(60,45,30,.06)}
.eng{font-family:var(--en);text-transform:uppercase;letter-spacing:.32em;color:var(--ink2);font-size:12px;font-weight:500}

/* reveal on scroll: visible by default, only hidden once the script is running */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}

/* opening: like a printed card, the photo sits in generous margins with the quote beneath it */
.hero{padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:88px;text-align:center}
.hero-top{margin:0 0 30px;font-family:var(--en);font-size:12px;font-weight:500;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:var(--ink2)}
.hero-photo{margin:0 auto;width:min(66%,300px)}
.hero-photo img{width:100%;height:auto;max-height:58vh;object-fit:cover;display:block;box-shadow:0 1px 2px rgba(47,42,37,.08)}
.hero-quote{margin:46px auto 0;max-width:22em}
.hero-quote p{margin:0;font-size:13.5px;line-height:2.1;word-break:keep-all;white-space:pre-line;color:var(--ink)}
.hero-rule{display:block;width:120px;height:1px;background:var(--ink2);opacity:.35;margin:26px auto 22px}
.hero-quote cite{display:block;font-style:normal;font-size:11.5px;letter-spacing:.02em;color:var(--ink2)}
.js .hero .rv:nth-child(2){transition-delay:.25s}
.js .hero .rv:nth-child(3){transition-delay:.55s}
.rule{width:1px;height:56px;background:var(--line);margin:0 auto}

/* archive */
.archive{padding-top:96px;padding-bottom:40px;text-align:center}
.archive h2{margin:0;font-family:var(--en);font-weight:400;font-size:30px;letter-spacing:.36em;text-indent:.36em;color:var(--ink)}
.archive .meta{margin-top:10px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:30px}
.tag{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2);background:var(--page);line-height:1.5}
.tag:hover{border-color:var(--ink2);color:var(--ink)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:28px}
.feat button{display:block;aspect-ratio:1;overflow:hidden;background:var(--soft)}
.feat img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
@media (hover:hover){.feat button:hover img{transform:scale(1.04)}}
.all{display:inline-flex;align-items:baseline;gap:10px;margin-top:34px;border:1px solid var(--ink);border-radius:999px;padding:13px 30px;font-size:14px;letter-spacing:.06em}
.all span{font-family:var(--en);font-size:15px;color:var(--ink2);letter-spacing:.04em}
.empty{color:var(--ink2);font-size:14px;margin-top:28px}

/* footer */
footer{padding-top:64px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;display:grid;gap:18px;justify-items:center}
footer .upd{font-family:var(--en);font-size:13px;letter-spacing:.24em;color:var(--ink2);text-transform:uppercase}
.share{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:3px;letter-spacing:.04em}
.share svg{width:15px;height:15px}

/* layers */
.layer{position:fixed;inset:0;background:var(--page);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#album{z-index:20}
#viewer{z-index:30}
.lbar{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:6px;height:54px}
.lbar .ttl{flex:1;text-align:center;font-family:var(--en);letter-spacing:.3em;text-indent:.3em;font-size:15px}
.ico{width:44px;height:44px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--ink)}
.filters{max-width:1040px;margin:0 auto;display:grid;gap:8px;padding-bottom:12px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.row .lab{flex:none;width:40px;font-family:var(--en);font-size:11px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;color:var(--ink2);background:var(--page)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.chip .n{font-family:var(--en);margin-left:5px;opacity:.75}
.awrap{max-width:1040px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.together{margin:22px 0 -12px;font-size:14px;color:var(--ink)}
.count{margin:22px 0 14px;font-family:var(--en);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}
.grid{display:flex;gap:8px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:600px){.grid{gap:14px}.col{gap:22px}}
.print{display:grid;gap:6px;text-align:left;min-width:0}
.print .ph{position:relative;background:var(--soft);aspect-ratio:var(--ar,4/3);overflow:hidden}
.print img{width:100%;height:100%;object-fit:cover;display:block}
.print .cap{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print .cap:empty{display:none}
.none{padding:60px 0;text-align:center;color:var(--ink2)}

/* full-screen photo view: photo fills the screen, thumbnails of the other photos run along the bottom */
#viewer{background:#111;color:#f3efe7;overflow:hidden;display:flex;flex-direction:column}
.fs-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:env(safe-area-inset-top,0px);height:calc(52px + env(safe-area-inset-top,0px))}
.fs-top #v-pos{font-family:var(--en);font-size:14px;letter-spacing:.16em;color:rgba(243,239,231,.7)}
.fs-ico{width:48px;height:48px;display:grid;place-items:center;font-size:20px;color:#f3efe7}
.fs-acts{display:flex;align-items:center;gap:2px;margin-right:6px}
.fs-btn{width:44px;height:44px;display:grid;place-items:center;color:#f3efe7;border-radius:50%}
.fs-btn svg{width:24px;height:24px}
.fs-btn:active{background:rgba(243,239,231,.12)}
.fs-btn[disabled]{opacity:.45}
.fs-stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.fs-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none}
.fs-stage img.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.fs-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;font-size:34px;color:rgba(243,239,231,.75)}
.fs-nav.prev{left:4px}.fs-nav.next{right:4px}
@media (hover:none){.fs-nav{display:none}}
.fs-info{flex:none;padding:12px 16px 4px;text-align:center;display:grid;gap:8px;min-height:20px}
.fs-info .txt{font-size:14px;line-height:1.6;color:rgba(243,239,231,.9);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.fs-info .txt span{color:rgba(243,239,231,.55)}
.fs-info .ptags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.fs-info .ptags::-webkit-scrollbar{display:none}
.fs-info .tag{flex:none;background:transparent;border-color:rgba(243,239,231,.25);color:rgba(243,239,231,.85);font-size:12.5px;padding:4px 11px}
.fs-strip{flex:none;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.fs-strip::-webkit-scrollbar{display:none}
.fs-strip button{flex:none;width:52px;height:52px;background:#2a2622;opacity:.45;transition:opacity .2s}
.fs-strip button.on{opacity:1;outline:2px solid #f3efe7;outline-offset:-2px}
.fs-strip img{width:100%;height:100%;object-fit:cover;display:block}
#viewer.bare .fs-top,#viewer.bare .fs-info,#viewer.bare .fs-strip{display:none}
.tag.person::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6;margin-right:6px;vertical-align:2px}

/* background music */
.music{position:fixed;z-index:40;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,calc((100vw - 480px)/2 + 14px));width:40px;height:40px;border-radius:50%;background:rgba(31,28,25,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.music svg{width:18px;height:18px}
.music .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.music .bars i{width:2px;background:#fff;border-radius:1px;height:4px}
.music.on .bars i{animation:eq 1s ease-in-out infinite}
.music.on .bars i:nth-child(2){animation-delay:.2s}.music.on .bars i:nth-child(3){animation-delay:.4s}.music.on .bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.music .off{display:none}.music:not(.on) .bars{display:none}.music:not(.on) .off{display:block}
.music.wait{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(255,255,255,.18)}}
@media (prefers-reduced-motion:reduce){.music.on .bars i,.music.wait{animation:none}.music.on .bars i{height:10px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--dark);color:var(--page);padding:10px 18px;border-radius:999px;font-size:13.5px;max-width:calc(100% - 40px);text-align:center;word-break:break-all}
</style>
</head>
<body>
<script>document.documentElement.classList.add("js")</script>
<div class="page">
  <header class="hero gut">
    <p class="hero-top rv">For my father</p>
    <figure class="hero-photo rv"><img id="cover-img" src="cover.jpg" alt=""></figure>
    <div class="hero-quote rv" id="quote" hidden>
      <p id="q-text"></p>
      <span class="hero-rule" aria-hidden="true"></span>
      <cite id="q-src"></cite>
    </div>
  </header>

  <div class="rule"></div>

  <section class="archive gut" id="archive">
    <h2 class="rv">ARCHIVE</h2>
    <div class="eng meta rv" id="a-meta"></div>
    <div class="tags rv" id="a-people"></div>
    <div class="tags rv" id="a-tags" style="margin-top:8px"></div>
    <div class="feat rv" id="a-feat"></div>
    <p class="empty" id="a-empty" hidden>사진을 준비하고 있어요</p>
    <button class="all rv" id="a-all" type="button">전체 사진 보기<span id="a-count"></span></button>
  </section>

  <footer class="gut">
    <div class="rule" style="height:40px"></div>
    <div class="upd" id="f-upd"></div>
    <button class="share" id="f-share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v6.5h14V13"/></svg>링크 공유하기</button>
  </footer>
</div>

<div class="layer" id="album" hidden role="dialog" aria-modal="true" aria-label="전체 사진">
  <div class="lbar gut">
    <div class="in"><button class="ico" id="al-close" aria-label="돌아가기">‹</button><span class="ttl">ARCHIVE</span><span style="width:44px"></span></div>
    <div class="filters">
      <div class="row" id="r-people"></div>
      <div class="row" id="r-tags"></div>
    </div>
  </div>
  <div class="awrap gut" id="pages"></div>
</div>

<div class="layer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="fs-top"><button class="fs-ico" id="v-close" aria-label="닫기">✕</button><span id="v-pos"></span><span class="fs-acts"><button class="fs-btn" id="v-share" type="button" aria-label="사진 공유" title="공유"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5v11M8 7.5l4-4 4 4M8.5 10.5H6.5v10h11v-10h-2"/></svg></button><button class="fs-btn" id="v-save" type="button" aria-label="사진 저장" title="저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5v11.5M7.5 10.5l4.5 4.5 4.5-4.5M4.5 15v4.5h15V15"/></svg></button></span></div>
  <div class="fs-stage" id="v-print"><img id="v-img" alt=""><button class="fs-nav prev" id="v-prev" aria-label="이전 사진">‹</button><button class="fs-nav next" id="v-next" aria-label="다음 사진">›</button></div>
  <div class="fs-info" id="v-cap"></div>
  <div class="fs-strip" id="v-strip" aria-label="다른 사진들"></div>
</div>
<button class="music" id="music" type="button" hidden aria-label="배경음악 켜기"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 17.5A2.5 2.5 0 1 1 6.5 15c.17 0 .34.02.5.05V5.5l11-2v11a2.5 2.5 0 1 1-2-2.45V7.06l-7 1.27v9.17z"/></svg></button>
<div class="toast" id="toast" hidden></div>

<script>/* always fetch the newest photo list, never a copy the phone kept from an earlier visit */document.write('<script src="data.js?t='+Date.now()+'"><\/script>')</script>
<script>
(function(){
const A=window.ALBUM||{meta:{},people:[],photos:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const meta=Object.assign({title:"기억하는 방법",quote:"",quoteSrc:"",updated:0},A.meta||{});
const people=A.people||[];
const photos=(A.photos||[]).slice().sort((a,b)=>(a.year||9999)-(b.year||9999)||(a.added||0)-(b.added||0));
const pmap=Object.fromEntries(people.map(p=>[p.id,p.name]));
const ratio=p=>p.w&&p.h?Math.min(2.6,Math.max(.45,p.w/p.h)):4/3;
const thumb=p=>"photos/thumb/"+p.id+".jpg", full=p=>"photos/full/"+p.id+".jpg";
function toast(t,ms=2600){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}
const isPhone=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);

/* ---------- main page ---------- */
const coverP=meta.cover&&photos.find(p=>p.id===meta.cover);
if(coverP)$("cover-img").src=full(coverP);
$("cover-img").alt="아빠의 사진";
/* background music: phones only allow sound after a tap, so it starts on the first tap anywhere */
if(meta.music){
  const au=new Audio();au.src=meta.music;au.loop=true;au.preload="auto";
  const btn=$("music");btn.hidden=false;btn.classList.add("wait");
  let wanted=true,started=false,resumeOnShow=false;
  const ui=()=>{const on=!au.paused;btn.classList.toggle("on",on);btn.classList.toggle("wait",!started&&wanted);btn.setAttribute("aria-label",on?"배경음악 끄기":"배경음악 켜기")};
  const play=()=>{au.volume=0;const pr=au.play();if(pr&&pr.then)pr.then(()=>{started=true;let v=0;const t=setInterval(()=>{v=Math.min(1,v+.08);au.volume=v;if(v>=1)clearInterval(t)},100);ui()}).catch(()=>ui());else ui()};
  const first=e=>{if(started||!wanted||e.target.closest&&e.target.closest("#music"))return;play()};
  ["pointerup","touchend","click","keydown"].forEach(t=>document.addEventListener(t,first,{capture:true,passive:true}));
  btn.onclick=e=>{e.stopPropagation();if(au.paused){wanted=true;play()}else{wanted=false;au.pause();ui()}};
  au.addEventListener("pause",ui);au.addEventListener("play",ui);
  document.addEventListener("visibilitychange",()=>{if(document.hidden){resumeOnShow=!au.paused;au.pause()}else if(resumeOnShow&&wanted)au.play().catch(()=>{})});
}
if(meta.quote){$("quote").hidden=false;$("q-text").textContent=meta.quote;$("q-src").textContent=meta.quoteSrc||"";$("q-src").hidden=!meta.quoteSrc}

$("a-meta").textContent=photos.length?`${photos.length.toLocaleString()} photos`:"";
const tc=new Map();photos.forEach(p=>(p.tags||[]).forEach(t=>tc.set(t,(tc.get(t)||0)+1)));
const tagList=[...tc.keys()].sort((a,b)=>tc.get(b)-tc.get(a)||a.localeCompare(b,"ko"));
$("a-tags").innerHTML=tagList.slice(0,14).map(t=>`<button class="tag" data-t="${esc(t)}">#${esc(t)}</button>`).join("");
$("a-tags").hidden=!tagList.length;
const pcount=new Map();photos.forEach(p=>(p.people||[]).forEach(id=>pcount.set(id,(pcount.get(id)||0)+1)));
const peopleList=people.filter(p=>pcount.get(p.id)).sort((a,b)=>pcount.get(b.id)-pcount.get(a.id));
$("a-people").innerHTML=peopleList.slice(0,12).map(p=>`<button class="tag person" data-p="${esc(p.id)}">${esc(p.name)}</button>`).join("");
$("a-people").hidden=!peopleList.length;
if(!peopleList.length)$("a-tags").style.marginTop="";
let featured=photos.filter(p=>p.f);
if(!featured.length)featured=photos.slice(0,12);
featured=featured.slice(0,30);
$("a-feat").innerHTML=featured.map((p,i)=>`<button data-i="${i}" aria-label="${esc(p.caption||p.place||"사진")}"><img loading="lazy" decoding="async" src="${thumb(p)}" alt=""></button>`).join("");
$("a-feat").hidden=!featured.length;$("a-empty").hidden=!!photos.length;
$("a-all").hidden=!photos.length;$("a-count").textContent=photos.length.toLocaleString();
if(meta.updated){const d=new Date(meta.updated);$("f-upd").textContent=`Updated  ${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}`}

$("a-feat").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)openViewer(featured,+b.dataset.i)});
$("a-people").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;Object.assign(S,{fPeople:[b.dataset.p],fTag:null});openAlbum()});
$("a-tags").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;Object.assign(S,{fTag:b.dataset.t,fPeople:[]});openAlbum()});
$("a-all").onclick=()=>{Object.assign(S,{fTag:null,fPeople:[]});openAlbum()};

$("f-share").onclick=async()=>{
  const url=location.href.split("#")[0];
  if(isPhone&&navigator.share){try{await navigator.share({title:document.title,url})}catch(e){}return}
  try{await navigator.clipboard.writeText(url);toast("링크를 복사했어요")}
  catch(e){toast(url,6000)}
};

/* reveal on scroll */
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}else document.querySelectorAll(".rv").forEach(el=>el.classList.add("in"));

/* ---------- layers + back button ---------- */
const stack=[];let ignorePop=0;
function lock(){document.documentElement.style.overflow=document.body.style.overflow=stack.length?"hidden":""}
function openLayer(id){if(stack[stack.length-1]===id)return;stack.push(id);$(id).hidden=false;lock();try{history.pushState({layer:id},"")}catch(e){}}
function hideTop(){const id=stack.pop();if(id)$(id).hidden=true;lock()}
function closeLayer(){if(!stack.length)return;hideTop();if(history.state&&history.state.layer){ignorePop++;history.back()}}
addEventListener("popstate",()=>{if(ignorePop){ignorePop--;return}hideTop()});

/* ---------- full archive ---------- */
const S={fPeople:[],fTag:null,view:[]};
const colCount=()=>{const w=Math.min(innerWidth,1040);return w<600?2:w<900?3:4};
function filtered(){return photos.filter(p=>S.fPeople.every(id=>(p.people||[]).includes(id))&&(!S.fTag||(p.tags||[]).includes(S.fTag)))}
let lastCols=0;
function renderAlbum(){
  const pc=new Map();photos.forEach(p=>(p.people||[]).forEach(id=>pc.set(id,(pc.get(id)||0)+1)));
  const ppl=people.filter(p=>pc.get(p.id)).sort((a,b)=>pc.get(b.id)-pc.get(a.id));
  $("r-people").hidden=!ppl.length;
  $("r-people").innerHTML=`<span class="lab">With</span><button class="chip" data-p="" aria-pressed="${!S.fPeople.length}">모두</button>`+
    ppl.map(p=>`<button class="chip" data-p="${esc(p.id)}" aria-pressed="${S.fPeople.includes(p.id)}">${esc(p.name)}<span class="n">${pc.get(p.id)}</span></button>`).join("");
  $("r-tags").hidden=!tagList.length;
  $("r-tags").innerHTML=`<span class="lab">Tag</span><button class="chip" data-t="" aria-pressed="${!S.fTag}">모두</button>`+
    tagList.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="${S.fTag===t}">#${esc(t)}<span class="n">${tc.get(t)}</span></button>`).join("");
  const list=filtered();S.view=list;
  const pg=$("pages");
  if(!list.length){pg.innerHTML=`<div class="none">${S.fPeople.length>1?"고른 분들이 함께 나온 사진이 없어요":"조건에 맞는 사진이 없어요"}</div>`;return}
  const nc=colCount();lastCols=nc;
  const cols=Array.from({length:nc},()=>({h:0,html:""}));
  list.forEach(p=>{
    const c=cols.reduce((a,b)=>b.h<a.h-1e-6?b:a);const cap=p.caption||p.place||"";
    c.h+=1/ratio(p)+(cap?.12:0)+.06;
    c.html+=`<button class="print" data-id="${esc(p.id)}" aria-label="${esc(p.caption||p.place||"사진")}"><div class="ph" style="--ar:${ratio(p)}"><img loading="lazy" decoding="async" src="${thumb(p)}" alt=""></div><div class="cap">${esc(cap)}</div></button>`;
  });
  const together=S.fPeople.length>1?`<p class="together">${S.fPeople.map(id=>esc(pmap[id]||"")).join(" · ")} 함께 나온 사진</p>`:"";
  const html=together+`<p class="count">${list.length.toLocaleString()} photos</p><div class="grid">`+cols.map(c=>`<div class="col">${c.html}</div>`).join("")+"</div>";
  pg.innerHTML=html;
}
function openAlbum(){renderAlbum();openLayer("album");$("album").scrollTop=0}
$("al-close").onclick=closeLayer;
addEventListener("resize",()=>{if(!$("album").hidden&&colCount()!==lastCols)renderAlbum()});
$("r-people").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;const id=b.dataset.p;
  // several people can be on at once: the archive then shows photos where they all appear together
  if(!id)S.fPeople=[];else S.fPeople=S.fPeople.includes(id)?S.fPeople.filter(x=>x!==id):[...S.fPeople,id];
  renderAlbum();$("album").scrollTop=0});
$("r-tags").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;S.fTag=b.dataset.t||null;renderAlbum();$("album").scrollTop=0});
$("pages").addEventListener("click",e=>{const b=e.target.closest(".print");if(!b)return;openViewer(S.view,S.view.findIndex(p=>p.id===b.dataset.id))});

/* ---------- photo view ---------- */
const V={list:[],idx:-1};
let stripIO=null;
function buildStrip(){
  const st=$("v-strip");if(stripIO)stripIO.disconnect();
  st.innerHTML=V.list.map((p,i)=>`<button data-i="${i}" aria-label="${i+1}번째 사진"><img data-src="${thumb(p)}" alt=""></button>`).join("");
  // only load the small pictures that are near the visible part of the strip
  stripIO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const im=en.target;im.src=im.dataset.src;stripIO.unobserve(im)}}),{root:st,rootMargin:"0px 400px"});
  st.querySelectorAll("img").forEach(im=>stripIO.observe(im));
}
function openViewer(list,i){if(i<0||!list.length)return;V.list=list;V.idx=i;$("viewer").classList.remove("bare");openLayer("viewer");buildStrip();show()}
function show(){
  const p=V.list[V.idx];if(!p)return;
  $("v-pos").textContent=`${V.idx+1} / ${V.list.length}`;
  zReset(false);$("v-img").src=full(p);$("v-img").alt=p.caption||"";
  const names=(p.people||[]).filter(id=>pmap[id]);const tags=p.tags||[];
  $("v-cap").innerHTML=(p.caption||p.place?`<div class="txt">${esc(p.caption||"")}${p.caption&&p.place?" ":""}${p.place?`<span>${p.caption?"· ":""}${esc(p.place)}</span>`:""}</div>`:"")+
    (names.length||tags.length?`<div class="ptags">${names.map(id=>`<button class="tag person" data-goto="${esc(id)}">${esc(pmap[id])}</button>`).join("")}${tags.map(t=>`<button class="tag" data-gotag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:"");
  prefetch(p);
  const st=$("v-strip");st.querySelectorAll("button.on").forEach(b=>b.classList.remove("on"));
  const cb=st.querySelector(`[data-i="${V.idx}"]`);if(cb){cb.classList.add("on");st.scrollTo({left:cb.offsetLeft-st.clientWidth/2+cb.offsetWidth/2,behavior:"smooth"})}
  const nx=V.list[V.idx+1];if(nx){const im=new Image();im.src=full(nx)}
}
function step(d){V.idx=(V.idx+d+V.list.length)%V.list.length;show()}
$("v-close").onclick=closeLayer;
$("v-strip").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;V.idx=+b.dataset.i;show()});
// tap the photo to hide or show everything around it
$("v-prev").onclick=()=>step(-1);$("v-next").onclick=()=>step(1);
$("v-cap").addEventListener("click",e=>{const b=e.target.closest("[data-goto],[data-gotag]");if(!b)return;
  Object.assign(S,{fPeople:b.dataset.goto?[b.dataset.goto]:[],fTag:b.dataset.gotag||null});
  if($("album").hidden){
    // swap the photo view for the archive in place, so the back button still returns to the main page
    $("viewer").hidden=true;stack[stack.length-1]="album";renderAlbum();$("album").hidden=false;$("album").scrollTop=0;
    try{history.replaceState({layer:"album"},"")}catch(e){}
  }else{closeLayer();renderAlbum();$("album").scrollTop=0}
});
addEventListener("keydown",e=>{if($("viewer").hidden)return;if(e.key==="Escape")closeLayer();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
/* pinch to zoom, drag to look around when zoomed, double-tap to zoom in/out, swipe to change photo, tap to hide the bars */
const Z={s:1,x:0,y:0};
function zApply(anim){const im=$("v-img");im.classList.toggle("anim",!!anim);im.style.transform=Z.s===1&&!Z.x&&!Z.y?"":`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
function zClamp(){
  const im=$("v-img"),st=$("v-print");const w=im.offsetWidth*Z.s,h=im.offsetHeight*Z.s;
  const mx=Math.max(0,(w-st.clientWidth)/2),my=Math.max(0,(h-st.clientHeight)/2);
  Z.x=Math.min(mx,Math.max(-mx,Z.x));Z.y=Math.min(my,Math.max(-my,Z.y));
}
function zReset(anim){Z.s=1;Z.x=0;Z.y=0;zApply(anim)}
function zToggleAt(cx,cy){
  if(Z.s>1){zReset(true);return}
  const r=$("v-print").getBoundingClientRect();const qx=cx-(r.left+r.width/2),qy=cy-(r.top+r.height/2);
  Z.s=2.5;Z.x=-qx*1.5;Z.y=-qy*1.5;zClamp();zApply(true);
}
(function(){
  const st=$("v-print");let g=null,lastTap=0,tapTimer=0;
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const center=()=>{const r=st.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}};
  st.addEventListener("touchstart",e=>{
    if(e.target.closest(".fs-nav"))return;
    const t=e.touches;
    if(t.length===2){const c=center(),m=mid(t);g={mode:"pinch",d0:dist(t),s0:Z.s,x0:Z.x,y0:Z.y,mx:m.x-c.x,my:m.y-c.y,moved:true}}
    else if(t.length===1&&!g)g={mode:"one",sx:t[0].clientX,sy:t[0].clientY,x0:Z.x,y0:Z.y,t:Date.now(),moved:false};
  },{passive:true});
  st.addEventListener("touchmove",e=>{
    if(!g)return;e.preventDefault();const t=e.touches;
    if(g.mode==="pinch"&&t.length>=2){
      const c=center(),m=mid(t);const s=Math.min(5,Math.max(1,g.s0*dist(t)/g.d0));
      // keep the spot between the fingers under the fingers
      const px=(g.mx-g.x0)/g.s0,py=(g.my-g.y0)/g.s0;
      Z.s=s;Z.x=(m.x-c.x)-px*s;Z.y=(m.y-c.y)-py*s;zClamp();zApply(false);
    }else if(g.mode==="one"&&t.length===1){
      const dx=t[0].clientX-g.sx,dy=t[0].clientY-g.sy;if(Math.abs(dx)>8||Math.abs(dy)>8)g.moved=true;
      if(Z.s>1){Z.x=g.x0+dx;Z.y=g.y0+dy;zClamp();zApply(false)}
    }
  },{passive:false});
  let lastTouch=0;
  st.addEventListener("touchend",e=>{
    lastTouch=Date.now();
    if(!g)return;
    if(g.mode==="pinch"){if(e.touches.length===0){if(Z.s<1.05)zReset(true);g=null}return}
    const ct=e.changedTouches[0];const dx=ct.clientX-g.sx,dy=ct.clientY-g.sy;const gg=g;g=null;
    if(gg.moved){if(Z.s===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);return}
    if(e.target.closest(".fs-nav"))return;
    const now=Date.now();
    if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;zToggleAt(ct.clientX,ct.clientY)}
    else{lastTap=now;tapTimer=setTimeout(()=>{if(Z.s===1)$("viewer").classList.toggle("bare")},300)}
  });
  st.addEventListener("touchcancel",()=>{g=null});
  // mouse: click hides the bars, double-click zooms, wheel zooms, drag pans
  st.addEventListener("click",e=>{if(Date.now()-lastTouch<800)return;if(e.target.closest(".fs-nav"))return;if(e.detail===1)tapTimer=setTimeout(()=>{if(Z.s===1)$("viewer").classList.toggle("bare")},260)});
  st.addEventListener("dblclick",e=>{if(Date.now()-lastTouch<800)return;clearTimeout(tapTimer);if(e.target.closest(".fs-nav"))return;zToggleAt(e.clientX,e.clientY)});
  st.addEventListener("wheel",e=>{e.preventDefault();const c=center();const ns=Math.min(5,Math.max(1,Z.s*Math.exp(-e.deltaY*.002)));const qx=e.clientX-c.x,qy=e.clientY-c.y;
    Z.x=qx-(qx-Z.x)*ns/Z.s;Z.y=qy-(qy-Z.y)*ns/Z.s;Z.s=ns;if(Z.s<=1.01){Z.s=1;Z.x=0;Z.y=0}zClamp();zApply(false)},{passive:false});
  let md=null;
  st.addEventListener("mousedown",e=>{if(Z.s>1){md={x:e.clientX,y:e.clientY,x0:Z.x,y0:Z.y};e.preventDefault()}});
  addEventListener("mousemove",e=>{if(!md)return;Z.x=md.x0+e.clientX-md.x;Z.y=md.y0+e.clientY-md.y;zClamp();zApply(false)});
  addEventListener("mouseup",()=>{md=null});
})();

/* save one photo: share sheet on phones (straight to the gallery), plain download elsewhere */
let pf={id:null,blob:null,promise:null};
function prefetch(p){
  if(pf.id===p.id)return;
  const mine={id:p.id,blob:null,promise:null};pf=mine;
  mine.promise=fetch(full(p)).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>{mine.blob=b;return b}).catch(()=>null);
}
function fileName(p){const base=p.caption||p.place||"사진_"+(V.idx+1);return base.replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,50)+".jpg"}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
// phones only open the share sheet right after a tap, so use the photo that was already loaded when the photo opened
async function photoFile(btn){
  const p=V.list[V.idx];if(!p)return null;
  let blob=pf.id===p.id?pf.blob:null;
  if(!blob){btn.disabled=true;prefetch(p);blob=await pf.promise;btn.disabled=false}
  if(!blob){toast("사진을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요",4000);return null}
  return {blob,file:new File([blob],fileName(p),{type:blob.type||"image/jpeg"})};
}
const canShareFile=f=>!!(navigator.canShare&&navigator.canShare({files:[f]}));
/* save: iPhone can only put a web photo into the Photos app through its share sheet ("이미지 저장"); elsewhere it downloads */
$("v-save").onclick=async()=>{
  const r=await photoFile($("v-save"));if(!r)return;
  if(isIOS&&canShareFile(r.file)){
    try{await navigator.share({files:[r.file]})}catch(e){if(!(e&&e.name==="AbortError"))toast("사진을 길게 눌러 ‘사진 앱에 저장’을 골라 주세요",4500)}
    return;
  }
  download(r.blob,r.file.name);
  toast(isPhone?"사진을 저장했어요. 갤러리의 ‘Download’ 앨범에서 볼 수 있어요":"사진을 내려받았어요",3500);
};
/* share: the phone's own share sheet (메시지, 카카오톡, 에어드롭 …) with the photo itself */
$("v-share").onclick=async()=>{
  const r=await photoFile($("v-share"));if(!r)return;
  if(canShareFile(r.file)){
    try{await navigator.share({files:[r.file]})}catch(e){if(!(e&&e.name==="AbortError"))toast("공유 창을 열지 못했어요",3000)}
    return;
  }
  const url=location.href.split("#")[0];
  if(navigator.share){try{await navigator.share({title:document.title,url})}catch(e){}return}
  try{await navigator.clipboard.writeText(url);toast("이 브라우저는 사진 공유를 지원하지 않아서, 사이트 링크를 복사했어요",4000)}catch(e){toast(url,6000)}
};
})();
</script>
